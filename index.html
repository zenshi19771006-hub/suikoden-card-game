<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水滸伝 梁山泊大戦</title><style>body{margin:0;background:#101b2c;color:#f5edda;font-family:system-ui,sans-serif}main{max-width:950px;margin:auto;padding:16px}h1{color:#ffd477}button{background:#d7a64b;border:0;border-radius:8px;padding:10px;color:#162031;font-weight:bold;cursor:pointer}button:disabled{opacity:.35}section{background:#202d42;border:1px solid #5c6675;border-radius:12px;padding:12px;margin:12px 0}.units{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.unit{background:#30415b;border:2px solid transparent;border-radius:10px;padding:8px;min-width:0;cursor:pointer}.unit.selected{border-color:#ffd477}.unit.dead{opacity:.35}.unit strong{display:block}.unit small{display:block}.bar{height:7px;background:#6d2634;border-radius:4px;overflow:hidden;margin:6px 0}.bar span{display:block;height:100%;background:#70cf92}#log{max-height:160px;overflow:auto;font-size:13px}#actions{display:flex;gap:8px;flex-wrap:wrap}p{line-height:1.5}@media(max-width:550px){.units{grid-template-columns:repeat(3,minmax(0,1fr))}.unit{font-size:12px}}</style></head><body><main><h1>水滸伝 梁山泊大戦</h1><p>試作版：5部隊戦略バトル。味方を選択 → 敵を選択 → 行動。各部隊は1ターンに1回行動します。</p><section><h2>敵軍</h2><div id="enemy" class="units"></div></section><section><h2>自軍</h2><div id="ally" class="units"></div></section><section><h2 id="turn"></h2><div id="actions"><button id="attack">通常攻撃</button><button id="skill">隊長スキル</button><button id="pass">行動終了</button><button id="restart">最初から</button></div><p id="hint"></p></section><section><h3>戦闘記録</h3><div id="log" aria-live="polite"></div></section></main><script>
const heroes=[['林冲',90,96,82,65,'連撃','火'],['宋江',85,68,75,96,'鼓舞','水'],['呉用',65,38,55,99,'神算','木'],['武松',82,98,76,50,'猛撃','金'],['盧俊義',92,75,88,86,'鉄壁','土'],['関勝',90,91,84,70,'猛撃','金'],['秦明',87,93,70,55,'連撃','火'],['呼延灼',92,86,90,75,'鉄壁','土'],['花栄',77,87,68,82,'連撃','木'],['公孫勝',72,53,64,98,'神算','水']];
let allies,enemies,turn,selectedAlly,selectedEnemy,finished;const $=id=>document.getElementById(id);function unit(h){return {name:h[0],base:h.slice(1,5),skill:h[5],element:h[6],members:10,stats:h.slice(1,5).map((v,i)=>v+Math.floor([70,65,60,55][i]*10/10)),hp:0,maxHp:0,acted:false,guard:0,boost:0}}function setup(){allies=heroes.slice(0,5).map(unit);enemies=heroes.slice(5).map(unit);for(const u of [...allies,...enemies])u.hp=u.maxHp=u.stats[0];turn=1;selectedAlly=0;selectedEnemy=0;finished=false;$('log').innerHTML='';note('戦闘開始！');render()}function note(s){const p=document.createElement('p');p.textContent=s;$('log').prepend(p)}function alive(u){return u.hp>0}function damage(a,d,mult=1){let amount=Math.max(1,Math.floor((a.stats[1]*.4-d.stats[2]*.2)*mult+a.boost));if(d.guard){amount=Math.max(1,Math.floor(amount*.5));d.guard--}d.hp=Math.max(0,d.hp-amount);a.boost=0;note(`${a.name} → ${d.name}：${amount}ダメージ`)}function skill(a,team,foes){switch(a.skill){case '連撃':{const d=foes.find(alive);if(d){damage(a,d,.75);if(alive(d))damage(a,d,.75)}break}case '猛撃':{const d=foes.find(alive);if(d)damage(a,d,1.65);break}case '鼓舞':team.filter(alive).forEach(u=>u.boost+=7);note(`${a.name}：味方全軍の次の攻撃を強化`);break;case '神算':foes.filter(alive).forEach(u=>u.hp=Math.max(0,u.hp-Math.max(1,Math.floor(a.stats[3]*.12-u.stats[3]*.03))));note(`${a.name}：敵全軍に計略攻撃`);break;case '鉄壁':team.filter(alive).forEach(u=>u.guard=1);note(`${a.name}：味方全軍に防御態勢`);break}}function check(){if(enemies.every(u=>!alive(u))){finished=true;note('勝利！敵軍を全滅させました')}else if(allies.every(u=>!alive(u))){finished=true;note('敗北。自軍が全滅しました')}}function next(){if(finished)return;if(allies.filter(alive).every(u=>u.acted)){note(`敵軍のターン ${turn}`);for(const e of enemies.filter(alive)){const targets=allies.filter(alive);if(!targets.length)break;const target=targets.reduce((x,y)=>x.hp<y.hp?x:y);damage(e,target);check();if(finished)break}if(!finished){turn++;allies.forEach(u=>u.acted=false);note(`第${turn}ターン開始`)}}selectedAlly=allies.findIndex(u=>alive(u)&&!u.acted);if(selectedAlly<0)selectedAlly=0;selectedEnemy=enemies.findIndex(alive);render()}function act(type){if(finished)return;const a=allies[selectedAlly],d=enemies[selectedEnemy];if(!a||!alive(a)||a.acted)return;if(type==='attack'){if(!d||!alive(d))return;damage(a,d)}else if(type==='skill'){if(['連撃','猛撃'].includes(a.skill)&&d&&alive(d)){const foes=[d,...enemies.filter(u=>u!==d)];skill(a,allies,foes)}else skill(a,allies,enemies)}else note(`${a.name}は待機した`);a.acted=true;check();next()}function render(){for(const [id,arr,side] of [['ally',allies,'a'],['enemy',enemies,'e']]){$(id).innerHTML='';arr.forEach((u,i)=>{const div=document.createElement('div');div.className='unit'+(!alive(u)?' dead':'')+((side==='a'?selectedAlly:selectedEnemy)===i?' selected':'');div.innerHTML=`<strong>${u.name}</strong><small>${u.element} / ${u.skill}</small><div class="bar"><span style="width:${u.hp/u.maxHp*100}%"></span></div><small>兵力 ${u.hp}/${u.maxHp}</small><small>武 ${u.stats[1]} 防 ${u.stats[2]} 知 ${u.stats[3]}</small><small>${u.acted?'行動済':''}</small>`;div.onclick=()=>{if(side==='a'&&!u.acted&&alive(u))selectedAlly=i;if(side==='e'&&alive(u))selectedEnemy=i;render()};$(id).append(div)})} $('turn').textContent=finished?'対戦終了':`第${turn}ターン（自軍行動）`;$('hint').textContent=finished?'「最初から」で再戦できます。':'隊長スキルは1行動を消費します。';for(const id of ['attack','skill','pass'])$(id).disabled=finished||!allies[selectedAlly]||allies[selectedAlly].acted||!alive(allies[selectedAlly]);} $('attack').onclick=()=>act('attack');$('skill').onclick=()=>act('skill');$('pass').onclick=()=>act('pass');$('restart').onclick=setup;setup();
</script></body></html>
