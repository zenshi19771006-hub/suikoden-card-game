<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b72"><title>英語100点への道 v3.15</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fb;color:#17263c;font-family:system-ui,"Noto Sans JP",sans-serif}header{background:#173b72;color:white;padding:22px 18px}header>div,main{max-width:760px;margin:auto}h1{font-size:24px;margin:0 0 7px}h2{font-size:21px}.card{background:white;border-radius:17px;padding:20px;margin:16px 0;box-shadow:0 3px 15px #1232}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#5f7085}.small{font-size:13px}.pill{background:#e7efff;color:#153d7d;border-radius:30px;padding:6px 11px;font-size:13px;white-space:nowrap}main{padding:14px}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:#2563eb;color:white;margin:5px 5px 5px 0}button:disabled{opacity:.5}button.secondary{background:#64748b}button.choice{display:block;width:100%;text-align:left;background:#eef3fb;color:#17263c;border:2px solid #dce5f1;margin:9px 0}button.choice:focus{border-color:#2563eb}.progress{height:11px;background:#dce5f0;border-radius:20px;overflow:hidden}.bar{height:100%;background:#16a34a}.notice,.feedback{padding:13px;background:#eff6ff;border-radius:10px;margin:12px 0;line-height:1.7}input[type=text]{font:inherit;width:100%;padding:14px;border:2px solid #b8c8dd;border-radius:10px;margin:10px 0}input[type=checkbox]{width:22px;height:22px;vertical-align:middle} .prompt{font-size:21px;font-weight:700;white-space:pre-line;line-height:1.55}.answer{font-weight:bold;color:#164f9c}footer{text-align:center;color:#617086;padding:30px}button:focus-visible,input:focus-visible{outline:3px solid #f59e0b} .hidden{display:none}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{font-size:12px;text-align:center;padding:9px 2px;background:#edf2f8;border-radius:7px}.studied{background:#bbf7d0;color:#14532d;font-weight:700}

/* v1.4 daily learning */

.daily-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.daily-stat{padding:10px 6px;background:#ffffff21;border-radius:9px;text-align:center}
.daily-stat b{display:block;font-size:19px;line-height:1.4}.daily-stat small{display:block;font-size:11px;line-height:1.5}
.daily-track{height:10px;border-radius:6px;background:#ffffff44;overflow:hidden;margin:14px 0 8px}

.daily-detail{font-size:13px;line-height:1.7}

.daily-bar{background:#eaf1fe;border-radius:11px;padding:13px;margin:0 0 15px;line-height:1.7}
.daily-header{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
@media(max-width:430px){header{padding:18px 16px}.card{padding:16px}.daily-hero{padding:16px}.daily-stats{gap:6px}.daily-stat b{font-size:17px}}

/* v1.5: learning mastery and retry */

.mastery-tag.pass{color:#164f9c;background:#e6f1ff}

.score-result h3{margin:2px 0 6px}

/* v1.7: study calendar and earned learning milestones */
.v17-panel{background:#fff;border-radius:17px;padding:18px;margin:16px 0;box-shadow:0 3px 15px #1232}
.v17-panel h2{margin:0 0 5px;font-size:20px}.v17-muted{font-size:13px;line-height:1.7;color:#52647b}
.v17-titleline{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.v17-month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 9px}
.v17-month-nav strong{font-size:16px;text-align:center}

.v17-legend span{display:inline-flex;gap:5px;align-items:center}
.v17-dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid #d2d8e4}
.v17-dot.master{background:#e6f7ed;border-color:#a7e2c0}.v17-dot.pass{background:#e8f2ff;border-color:#b5d2ff}.v17-dot.need{background:#fff4e6;border-color:#f3d6a7}
.v17-badge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0 7px}
.v17-award{border:1px solid #d8e7d9;background:#f5fbf5;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start;min-height:82px}
.v17-award.locked{background:#f8fafc;border-color:#e1e7ee;color:#7a8898}
.v17-medal{font-size:23px;line-height:1.2;min-width:25px}
.v17-award strong{display:block;font-size:13px;line-height:1.45}.v17-award small{font-size:11px;line-height:1.5;display:block;margin-top:3px}
.v17-goal{height:9px;border-radius:10px;background:#e8edf5;overflow:hidden;margin:10px 0 5px}.v17-goal>div{height:100%;background:#3973d4}
.v17-history{padding:0;list-style:none;margin:9px 0 0}.v17-history li{font-size:13px;border-bottom:1px solid #edf1f6;padding:9px 1px;display:flex;align-items:center;justify-content:space-between;gap:10px}.v17-history li:last-child{border:0}
@media(max-width:420px){.v17-panel{padding:14px}.v17-badge-grid{gap:7px}.v17-award{padding:9px;gap:6px;min-height:88px}.v17-medal{font-size:19px;min-width:20px}.v17-award strong{font-size:12px}.v17-day{min-height:41px}}

.v18-audit{border-left:4px solid #3a80bc;background:#f3f8ff;padding:10px 13px;border-radius:9px;font-size:13px;margin-top:12px;line-height:1.7}

/* v2.0: irregular verbs memorization cards */
.memo-intro{background:#f0f7ff;border:1px solid #b9d2f8;border-radius:12px;padding:15px;margin:14px 0;line-height:1.75}
.memo-card{margin:16px 0;padding:23px 18px;border:2px solid #c7d6ed;border-radius:18px;text-align:center;background:linear-gradient(#fff,#f7fbff);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}

.memo-actions{display:flex;gap:6px;flex-wrap:wrap}.memo-actions button{flex:1;min-width:125px}
.memo-count{font-size:13px;color:#516581}.memo-bar{height:10px;background:#e7eef7;border-radius:9px;overflow:hidden;margin-top:12px}

/* v2.1: learning quiz points, no monetary value */
.mini-home h2{margin:0 0 4px}.mini-topline{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}
.mini-coin{font-weight:800;color:#825000;background:#fff1c8;padding:10px 13px;border-radius:10px;white-space:nowrap}
.mini-rules{display:flex;flex-direction:column;gap:5px;border-radius:10px;padding:12px 14px;background:#f5f9ff;color:#273c58;font-size:13px;line-height:1.55;margin:12px 0}
.mini-rules strong{font-size:14px}.mini-label{display:block;font-weight:700;margin:13px 0 7px}
#quizUnitSelect{font:inherit;width:100%;border:2px solid #b8c8dd;border-radius:9px;padding:11px;background:white;margin-bottom:8px}
.mini-history-row{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-top:1px solid #e5ecf5;font-size:12px;flex-wrap:wrap}
.mini-score{font-size:46px;font-weight:900;color:#173b72}.point-award{font-weight:800;color:#155f42;background:#dcfce7;padding:9px 12px;border-radius:9px}

@media(max-width:430px){.mini-home{padding:16px}.mini-topline{align-items:center}}

/* v2.2: collectible cards — all rewards are in-app, non-transferable, without cash value */
.gacha-home{border:1px solid #d9e4f8;background:linear-gradient(160deg,#fff,#f1f6ff)}
.gacha-home h2{margin:0}.gacha-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gacha-balance{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;background:#fff0bf;color:#79500c;border-radius:999px;font-size:17px;font-weight:850}
.gacha-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.gacha-actions button{flex:1;min-width:135px}
.gacha-primary{background:#bd3a75;color:white}.gacha-secondary{background:#263e8f;color:white}
.gacha-ruleline{color:#455977;font-size:13px;margin:10px 0;line-height:1.8}
.gacha-stage{background:linear-gradient(150deg,#142957,#285aba);color:#fff;border-radius:18px;padding:19px;margin:16px 0;box-shadow:0 5px 16px #17284b28}
.gacha-stage h2{color:#fff;margin:4px 0}.gacha-stage p{color:#edf4ff}
.gacha-stage .gacha-balance{font-size:15px}
.gacha-card-face{position:relative;display:flex;flex-direction:column;align-items:center;overflow:hidden;border-radius:14px;background:#eef4fd;padding:5px;box-shadow:0 3px 10px #14274222;color:#1d2e45;text-align:center;border:4px solid #9ab5d9}
.gacha-card-face.n{border-color:#9caac0;background:linear-gradient(#fff,#e8eef6)}
.gacha-card-face.r{border-color:#5c83df;background:linear-gradient(#f5f8ff,#d9e6ff)}
.gacha-card-face.sr{border-color:#dcad38;background:linear-gradient(135deg,#fff8db,#ffe6a1,#fdf4d9)}
.gacha-card-face img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:#b3cee8}
.gacha-card-face .gacha-name{font-size:12px;font-weight:850;padding:6px 2px 3px;line-height:1.3;white-space:normal}
.gacha-card-face.big{width:min(100%,265px);padding:7px;border-width:5px;margin:14px auto}
.gacha-card-face.big .gacha-name{font-size:19px;padding:10px 4px 6px}
.gacha-card-face .gacha-rarity{position:absolute;left:9px;top:9px;background:#fff;color:#244171;border-radius:9px;padding:2px 7px;font-weight:900;box-shadow:0 2px 5px #0003}
.gacha-card-face.sr .gacha-rarity{background:#fef2b6;color:#815000}
.gacha-card-face.locked{background:#d7dfe9;border-color:#b8c3d2}
.gacha-card-face.locked .gacha-unknown{display:grid;place-items:center;aspect-ratio:4/5;width:100%;border-radius:8px;background:linear-gradient(145deg,#d4dde8,#bbc8d8);font-size:45px;color:#6b7e96;font-weight:900}
.gacha-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}
.gacha-tile{display:block;background:transparent;border:0;padding:0;margin:0;width:100%;min-width:0;border-radius:12px;box-shadow:none;color:inherit}
.gacha-tile .gacha-card-face{width:100%}.gacha-tile:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}
.gacha-filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.gacha-filters button{font-size:13px;padding:8px 11px;background:#e9eff9;color:#183b72;margin:0}
.gacha-filters button.active{background:#173b72;color:white}
.gacha-badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800;background:#ecf1fc;color:#183b72}
.gacha-info{padding:14px;border-radius:12px;background:#f3f7ff;color:#304663;font-size:14px;line-height:1.8;margin:12px 0}
.gacha-odds{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
.gacha-odds td,.gacha-odds th{padding:9px;border-bottom:1px solid #dce4ef;text-align:left}
.gacha-history{list-style:none;padding:0;margin:12px 0}.gacha-history li{border-bottom:1px solid #e5eaf2;padding:7px 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.gacha-reveal{background:radial-gradient(circle at 50% 28%,#fff7d4,#e2efff 55%,#f3f7ff);border:1px solid #d8e5fc;border-radius:18px;padding:15px;text-align:center;margin:14px 0}
.gacha-reveal strong{font-size:20px}.gacha-detail .gacha-card-face{margin-inline:auto}
.gacha-no-money{font-size:12px;color:#5f7085;line-height:1.65;margin:12px 0 0}
@media(max-width:410px){.gacha-grid{gap:7px}.gacha-card-face{border-width:3px;padding:3px}.gacha-card-face .gacha-name{font-size:11px}.gacha-card-face .gacha-rarity{top:5px;left:5px;font-size:11px}.gacha-stage{padding:15px}}

/* v2.3: gacha reveal ceremony, visual-only, skippable and motion-aware */
.v23-ceremony{position:relative;overflow:hidden;isolation:isolate;max-width:760px;margin:16px auto;background:radial-gradient(circle at 50% 40%,#345fbc 0%,#122953 53%,#0c1a37 100%);border-radius:22px;padding:23px 14px 22px;text-align:center;color:#fff;box-shadow:0 12px 29px #142a5440;min-height:455px}
.v23-ceremony h2{color:#fff;margin:3px 0 7px;font-size:23px;position:relative;z-index:4}
.v23-ceremony .v23-caption{color:#e5f0ff;font-size:14px;position:relative;z-index:4;margin:10px auto;max-width:350px}
.v23-orbit{position:relative;z-index:1;margin:20px auto 7px;width:min(85vw,300px);height:238px;display:flex;align-items:center;justify-content:center}
.v23-orbit:before{content:'';position:absolute;inset:-38px;background:repeating-conic-gradient(from 0deg,#fff8af80 0deg 9deg,transparent 9deg 23deg);border-radius:50%;filter:blur(4px);opacity:.4;animation:v23-rotate 8s linear infinite}
.v23-orbit:after{content:'';position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle,#fff2b6b8,#facc5424 48%,transparent 69%);animation:v23-glow 1.4s ease-in-out infinite}
.v23-chest{position:relative;z-index:2;width:192px;height:168px;transform-origin:center bottom;animation:v23-wiggle 1.15s ease-in-out infinite}
.v23-chest-body{position:absolute;bottom:3px;left:18px;right:18px;height:108px;background:linear-gradient(110deg,#8d2940,#df5070 52%,#8b2440);border:7px solid #e4ae46;border-radius:10px 10px 20px 20px;box-shadow:0 13px 0 #563046,0 18px 25px #0008;overflow:hidden}
.v23-chest-body:before{content:'';position:absolute;left:42%;width:18%;height:100%;background:linear-gradient(90deg,#e6a52f,#fff5aa,#dda143);box-shadow:0 0 10px #ffeb8999}
.v23-chest-body:after{content:'✦';position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:grid;place-items:center;width:43px;height:43px;background:radial-gradient(circle,#fffbdd,#efb43f);color:#a85f05;font-size:25px;border:4px solid #b47b24;border-radius:50%}
.v23-chest-lid{position:absolute;z-index:3;left:7px;right:7px;top:3px;height:80px;background:linear-gradient(135deg,#f95b84,#a42854);border:8px solid #eeb84f;border-radius:85px 85px 14px 14px;transform-origin:center bottom;box-shadow:0 -5px 0 #ffe7a6 inset;transition:transform .6s cubic-bezier(.2,.8,.3,1),filter .6s;overflow:hidden}
.v23-chest-lid:after{content:'';position:absolute;top:-3px;left:43%;width:14%;height:93px;background:linear-gradient(90deg,#b77712,#fff8c0,#cc8b20)}
.v23-ritual.opening .v23-chest{animation:v23-open-shake .25s ease-in-out 2}
.v23-ritual.opening .v23-chest-lid{transform:translateY(-61px) rotate(-14deg);filter:brightness(1.4)}
.v23-ritual.opening .v23-orbit:after{animation:v23-flare .6s ease-in forwards}
.v23-star{position:absolute;z-index:3;left:var(--x);top:var(--y);font-size:var(--sz);color:#fff6ad;opacity:0;pointer-events:none;animation:v23-twinkle 1s ease-in-out var(--delay) infinite}
.v23-ritual.opening .v23-star{animation:v23-spark .8s ease-out var(--delay) both}
.v23-ceremony .v23-skip{position:relative;z-index:6;background:#f2f6ff;color:#17365e;font-size:14px;font-weight:700;border:1px solid #ffffff8c}
.v23-ceremony button:focus-visible{outline:3px solid #facc15}
.v23-reveal{position:relative;text-align:center;overflow:hidden;border-radius:18px;background:radial-gradient(circle at 50% 34%,#fff9e5,#eef4ff 62%,#fff);border:2px solid #d6e3fa;padding:17px 12px;margin:15px 0}
.v23-reveal.r{background:radial-gradient(circle at 50% 34%,#e6e6ff,#e4f2ff 67%,#fff)}
.v23-reveal.sr{background:radial-gradient(circle at 50% 34%,#fff4b8,#f5dcff 60%,#fff);border-color:#e6bd4b;box-shadow:0 0 30px #facc1560}
.v23-reveal .v23-reveal-stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 2px,transparent 3px),radial-gradient(circle,#fbbf24 2px,transparent 3px);background-size:57px 83px,67px 55px;animation:v23-glow 2s ease-in-out infinite;opacity:.4}
.v23-reveal .v23-reveal-title{position:relative;z-index:2;font-size:22px;color:#193557;margin:9px auto;font-weight:900}
.v23-reveal .gacha-card-face{animation:v23-card-pop .7s cubic-bezier(.15,.8,.3,1.25) both;position:relative;z-index:2}
.v23-reveal .v23-rarity{position:relative;z-index:2;font-weight:900;font-size:22px;color:#23446f;margin:10px 0 7px}
.v23-reveal.sr .v23-rarity{color:#9b620c}
.v23-reveal.r .v23-rarity{color:#3d51aa}
.v23-result-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.v23-result-actions button{flex:1;min-width:145px}
.v23-volume{background:#eef2fb!important;color:#19406e!important;border:1px solid #cddff8!important}
@keyframes v23-rotate{to{transform:rotate(360deg)}}
@keyframes v23-glow{0%,100%{opacity:.5;transform:scale(.98)}50%{opacity:.95;transform:scale(1.1)}}
@keyframes v23-wiggle{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-9px)}}
@keyframes v23-open-shake{0%,100%{transform:translateX(0)}33%{transform:translateX(-8px)}66%{transform:translateX(8px)}}
@keyframes v23-flare{to{opacity:1;transform:scale(1.4);filter:blur(1px)}}
@keyframes v23-twinkle{0%,100%{opacity:.12;transform:scale(.5)}50%{opacity:1;transform:scale(1.4)}}

/* v3.13: clear daily review callout BEFORE the 30-minute study area. */
.v313-today{border-radius:17px;padding:18px 18px 16px;margin:12px 0 16px;border:2px solid #86c5a4;background:linear-gradient(135deg,#ecfff4,#f5fff9);color:#174d38;box-shadow:0 3px 15px #1231;scroll-margin-top:12px}

/* v3.14: review-finish messages and per-day activity calendar, local-only */
.v314-celebrate{background:linear-gradient(135deg,#fff5d6,#fffaf0);border:2px solid #e1b65d;color:#72500e;border-radius:14px;padding:17px;margin:13px 0;position:relative;overflow:hidden;animation:v314-arrive .45s ease-out}
.v314-celebrate h3{font-size:20px;margin:4px 0;color:#85530c}.v314-celebrate p{margin:8px 0 0;font-size:14px;line-height:1.65}

.v314-hero{font-size:31px;line-height:1.2;display:block;margin-bottom:4px}
.v314-calendar{background:#fff;border:1px solid #d2e3d6;border-radius:13px;padding:14px 12px;margin:19px 0}
.v314-calendar h3{margin:3px 0 6px!important}.v314-cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.v314-cal-head button{padding:6px 13px;font-size:14px;background:#eef5f1;color:#21543e;margin:0;border:1px solid #cbdcd2}
.v314-cal-month{font-weight:800;font-size:16px;color:#214b3b}.v314-calendar .v314-cal-note{font-size:12px;color:#577061;line-height:1.65;margin:6px 0 12px}
.v314-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.v314-cal-week{font-size:11px;text-align:center;color:#708477;padding:5px 0}.v314-cal-cell{aspect-ratio:1;background:#f5f8f6;border:1px solid transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#476354;min-width:0}
.v314-cal-cell em{font-size:13px;font-style:normal;font-weight:700}.v314-cal-cell span{font-size:9px;line-height:1;color:#237e5d;margin-top:2px;font-weight:800}.v314-cal-cell.has-study{background:#dff5e7;color:#165f42;border-color:#a8dfbc}.v314-cal-cell.finished{background:#fff0c9;color:#805308;border-color:#ebc579}.v314-cal-cell.is-today{outline:2px solid #276c4f;outline-offset:-2px}
.v314-cal-summary{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0 4px}.v314-cal-summary span{font-size:12px;background:#edf7ef;border-radius:18px;padding:5px 9px;color:#275643}
.v314-cal-legend{font-size:11px;color:#687a6b;margin-top:10px;line-height:1.6}
.v313-today.v314-done{background:#fffbef;border-color:#e6c276;color:#775114}.v313-today.v314-done h2{color:#805512}
@keyframes v314-arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.v314-celebrate{animation:none}}
@media(max-width:380px){.v314-calendar{padding:11px 7px}.v314-cal-grid{gap:3px}.v314-cal-cell em{font-size:12px}.v314-cal-cell span{font-size:8px}}

.v3141-achieve{border:1px solid #e4c16c;background:#fff9e5;color:#684c14;border-radius:11px;padding:13px;margin:14px 0;font-weight:800;display:flex;align-items:center;gap:10px}
.v3141-achieve.try-again{background:#f2f7fc;border-color:#d2e0ec;color:#375372}

.v3141-demo .v3141-results{margin:10px 0;color:#304a3b}

/* v3.15: read-only learner report using existing local records */
.v315-quick{margin:14px 0;padding:15px 16px;border:1px solid #b7cde8;border-radius:15px;background:linear-gradient(110deg,#e9f2ff,#f7fbff);color:#173b72;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}

.v315-panel{margin:18px 0;background:#fff;border:1px solid #c4d9ef;border-radius:18px;padding:20px;box-shadow:0 4px 18px #1232;scroll-margin-top:12px;line-height:1.65}
.v315-panel h2{font-size:22px;line-height:1.4;margin:3px 0}.v315-panel h3{font-size:17px;color:#193e70;margin:24px 0 11px}
.v315-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.v315-kpi{border-radius:12px;padding:13px 11px;text-align:center;background:#f0f5fd;border:1px solid #e3edfb}.v315-kpi strong{display:block;font-size:26px;color:#1c447e;font-variant-numeric:tabular-nums;line-height:1.4}.v315-kpi span{display:block;color:#526783;font-size:12px;line-height:1.5}
.v315-note{font-size:12px;line-height:1.65;color:#60738b;margin:10px 0}.v315-next{border-left:5px solid #1e8a65;padding:13px 15px;background:#eef9f3;border-radius:9px;margin:16px 0}
.v315-next strong{font-size:17px;color:#135c44}.v315-next p{margin:6px 0 8px;font-size:14px}.v315-next button{font-size:14px;margin:4px 0 0;background:#127b59;min-height:44px}
.v315-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.v315-day{padding:9px 1px 8px;border-radius:9px;border:1px solid #e3eaf2;background:#f7f9fc;min-height:97px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}.v315-day.worked{background:#edf7ff;border-color:#b9d9ef}.v315-day.today{outline:2px solid #225dac;outline-offset:-2px}.v315-day b{display:block;font-size:14px;color:#213f61}.v315-day .v315-day-label{font-size:10px;color:#64748b}.v315-day .v315-dot{display:block;font-size:10px;line-height:1.45;color:#244c7e;word-break:keep-all}.v315-day .v315-empty{color:#9da8b8;font-size:13px;margin-top:8px}
.v315-week-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:#566b86;margin-top:9px}
.v315-units{display:grid;grid-template-columns:1fr;gap:8px}.v315-unit{border:1px solid #e1e9f3;border-radius:10px;padding:11px 12px;background:#fbfcff}.v315-unit-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.v315-unit-top b{font-size:14px;color:#19334f}.v315-unit-score{white-space:nowrap;font-size:16px;font-weight:800;color:#194879}.v315-unit-score.none{color:#7f8ea2;font-size:13px}.v315-meter{height:7px;border-radius:9px;background:#e7eef6;overflow:hidden;margin:8px 0 5px}.v315-meter div{height:100%;background:#4787cf;border-radius:9px}.v315-unit-meta{font-size:11px;color:#62748a;line-height:1.55}

@media (max-width:430px){.v315-panel{padding:15px 13px}.v315-week{gap:3px}.v315-day{min-height:91px;padding:8px 0;font-size:11px}.v315-day .v315-dot{font-size:9px}.v315-kpi{padding:11px 5px}.v315-kpi strong{font-size:23px}.v315-quick button{width:100%}}
</style></head><body><header><div><h1>英語100点への道</h1>文法単元対応・オリジナル教材｜中1 12単元｜v3.15</div></header><main id="app"></main><footer>試作版 v3.15｜学習履歴はこのブラウザ内に保存</footer><script>
const baseSections=[{"name":"新出文法の和訳","mins":5,"info":"主語に合わせて am / is / are を使います。否定は not、疑問文は be動詞を主語の前に置きます。","qs":[{"prompt":"My sister is a junior high school student.","answer":"私の姉（妹）は中学生です。","kind":"self","explain":"sister は姉または妹。junior high school student は中学生。","choices":[],"aliases":[],"passage":""},{"prompt":"Those books are not mine.","answer":"あれらの本は私のものではありません。","kind":"self","explain":"Those books は「あれらの本」、mine は「私のもの」。","choices":[],"aliases":[],"passage":""},{"prompt":"Is your father at home now?","answer":"あなたのお父さんは今家にいますか。","kind":"self","explain":"Is を先頭に置く疑問文。at home は「家に」。","choices":[],"aliases":[],"passage":""},{"prompt":"These students are in the library.","answer":"これらの生徒は図書館にいます。","kind":"self","explain":"These students は複数なので are。場所を表す in the library を確認。","choices":[],"aliases":[],"passage":""},{"prompt":"Our English teacher is from Canada, but she is in Japan now.","answer":"私たちの英語の先生はカナダ出身ですが、今は日本にいます。","kind":"self","explain":"but は「しかし／〜ですが」。","choices":[],"aliases":[],"passage":""}]},{"name":"英文読解・和訳","mins":7,"info":"オリジナル英文を読んで、内容を正確に把握しましょう。","qs":[{"prompt":"My name is Haru. I am thirteen years old. My friend Mei is from Sapporo.","answer":"私の名前はハルです。私は13歳です。友達のメイは札幌出身です。","kind":"self","explain":"3文それぞれの主語とbe動詞を確認。","choices":[],"aliases":[],"passage":""},{"prompt":"Haru and Mei are in the same class.","answer":"ハルとメイは同じクラスです。","kind":"self","explain":"A and B は複数扱い。same は「同じ」。","choices":[],"aliases":[],"passage":""},{"prompt":"Is Mei from Tokyo?","answer":"No, she isn’t.","kind":"choice","explain":"本文ではメイは札幌出身。","choices":["Yes, she is.","No, she isn’t.","Yes, I am."],"aliases":[],"passage":""},{"prompt":"Who is thirteen years old?","answer":"Haru.","kind":"choice","explain":"13歳なのはハル。","choices":["Mei.","Haru.","Their teacher."],"aliases":[],"passage":""},{"prompt":"次の英文の内容として正しいものを選びなさい。","answer":"ハルとメイは同じクラスである。","kind":"choice","explain":"Haru and Mei are in the same class.","choices":["メイは東京出身である。","ハルとメイは同じクラスである。","ハルは15歳である。"],"aliases":[],"passage":""}]},{"name":"文法演習・並べ替え","mins":8,"info":"大文字・語順・疑問符にも注意。入力式では英文を自分で作りましょう。","qs":[{"prompt":"My parents (  ) at work now.","answer":"are","kind":"choice","explain":"My parents は複数。","choices":["am","is","are","do"],"aliases":[],"passage":""},{"prompt":"My brother and I (  ) students.","answer":"are","kind":"choice","explain":"My brother and I は2人なので複数扱い。","choices":["are","am","is","does"],"aliases":[],"passage":""},{"prompt":"次を否定文に：She is a science teacher.","answer":"She is not a science teacher.","kind":"input","explain":"be動詞の後に not。","choices":[""],"aliases":["She isn’t a science teacher."],"passage":""},{"prompt":"次を疑問文に：Those girls are your classmates.","answer":"Are those girls your classmates?","kind":"input","explain":"Are を主語の前に。","choices":[],"aliases":[],"passage":""},{"prompt":"次を疑問文に：Your bag is under the desk.","answer":"Is your bag under the desk?","kind":"input","explain":"Is を文頭に。","choices":[],"aliases":[],"passage":""},{"prompt":"語句を並べ替え： ( from / are / where / you / ? )","answer":"Where are you from?","kind":"input","explain":"Where + are + you + from?","choices":[],"aliases":[],"passage":""},{"prompt":"語句を並べ替え： ( not / these / mine / are / pens / . )","answer":"These pens are not mine.","kind":"input","explain":"These pens が主語。","choices":[],"aliases":[],"passage":""},{"prompt":"語句を並べ替え： ( the / is / who / boy / tall / ? )","answer":"Who is the tall boy?","kind":"input","explain":"Who is ...?","choices":[],"aliases":[],"passage":""},{"prompt":"次を短縮形で：They are not ready.","answer":"They aren’t ready.","kind":"input","explain":"are not → aren’t。","choices":[""],"aliases":["They're not ready."],"passage":""},{"prompt":"「彼女たちは今図書館にいません。」を英語で。","answer":"They are not in the library now.","kind":"input","explain":"They are not ... now.","choices":[""],"aliases":["They aren't in the library now.","They're not in the library now."],"passage":""}]},{"name":"単語のスペリング","mins":5,"info":"日本語を見て、英語を入力。スペルと複数形に注意。","qs":[{"prompt":"生徒","answer":"student","kind":"input","explain":"","choices":[],"aliases":[],"passage":""},{"prompt":"先生","answer":"teacher","kind":"input","explain":"","choices":[],"aliases":[],"passage":""},{"prompt":"図書館","answer":"library","kind":"input","explain":"","choices":[],"aliases":[],"passage":""},{"prompt":"親切な","answer":"kind","kind":"input","explain":"","choices":[],"aliases":[],"passage":""},{"prompt":"忙しい","answer":"busy","kind":"input","explain":"","choices":[],"aliases":[],"passage":""},{"prompt":"同級生","answer":"classmate","kind":"input","explain":"","choices":[],"aliases":[],"passage":""},{"prompt":"両親","answer":"parents","kind":"input","explain":"","choices":[],"aliases":[],"passage":""},{"prompt":"カナダ","answer":"Canada","kind":"input","explain":"","choices":[],"aliases":[],"passage":""},{"prompt":"彼らの","answer":"their","kind":"input","explain":"","choices":[],"aliases":[],"passage":""},{"prompt":"〜の下に","answer":"under","kind":"input","explain":"","choices":[],"aliases":[],"passage":""}]},{"name":"まとめテスト","mins":5,"info":"教科書内容の定着＋入試実戦を意識した応用問題。","qs":[{"prompt":"The children (  ) very quiet today.","answer":"are","kind":"choice","explain":"children は複数。","choices":["is","am","be","are"],"aliases":[],"passage":""},{"prompt":"This (  ) not my notebook.","answer":"is","kind":"choice","explain":"This は単数。","choices":["are","is","am","do"],"aliases":[],"passage":""},{"prompt":"「あれはあなたの自転車ですか。」を英語で。","answer":"Is that your bike?","kind":"input","explain":"Is that ...?","choices":[""],"aliases":["Is that your bicycle?"],"passage":""},{"prompt":"「私たちの教室は2階にあります。」を英語で。","answer":"Our classroom is on the second floor.","kind":"input","explain":"on the second floor = 2階に。","choices":[],"aliases":[],"passage":""},{"prompt":"語句を並べ替え： ( your / is / how / old / sister / ? )","answer":"How old is your sister?","kind":"input","explain":"How old is ...?","choices":[],"aliases":[],"passage":""},{"prompt":"「彼は私の兄ではありません。」を英語で。","answer":"He is not my brother.","kind" const grammarRules={
  be:{label:'単元1 be動詞',forbidden:[/\bthere\s+(?:is|are)\b/i,/\bneither\b/i,/\beither\b/i,/\b(?:does|doesn't|doesn’t|did|didn't|didn’t)\b/i]},
  verbs:{label:'単元2 一般動詞',forbidden:[/\bthere\s+(?:is|are)\b/i,/\bneither\b/i,/\beither\b/i,/\b(?:does|doesn't|doesn’t|did|didn't|didn’t)\b/i]},
  wh:{label:'単元3 疑問詞',forbidden:[/\bthere\s+(?:is|are)\b/i,/\bneither\b/i,/\beither\b/i,/\b(?:does|doesn't|doesn’t|did|didn't|didn’t)\b/i]},
  third:{label:'単元4 三人称単数',forbidden:[/\bthere\s+(?:is|are)\b/i,/\bneither\b/i,/\beither\b/i,/\b(?:did|didn't|didn’t)\b/i]}

function auditGrammar(){const datasets={be:baseSections,verbs:verbSections,wh:whSections,third:thirdSections};const issues=[];for(const [id,ss] of Object.entries(datasets)){const rules=grammarRules[id];ss.forEach((section,si)=>section.qs.forEach((q,qi)=>{const body=[q.prompt,q.answer,...(q.choices||[]),...(q.aliases||[])].join(' ');if(rules.forbidden.some(re=>re.test(body)))issues.push(`${rules.label} / ${section.name} / ${qi+1}問目`)}))}return issues}

let activeUnit='be';let sections=beSections;const KEY='english100_v03';let testMode=false;const empty=()=>({history:[],done:{},mistakes:{}});let state;function storageKey(){return activeUnit==='be'?KEY:activeUnit==='verbs'?'english100_v07_verbs':activeUnit==='wh'?'english100_v07_wh':activeUnit==='third'?'english100_v08_third':activeUnit==='pronouns'?'english100_v12_pronouns':activeUnit==='whyhow'?'english100_v12_whyhow':activeUnit==='can1'?'english100_v13_can1':activeUnit==='can2'?'english100_v13_can2':activeUnit==='pastbe'?'english100_v18_pastbe':activeUnit==='pastverbs'?'english100_v19_pastverbs':activeUnit==='irregular'?'english100_v20_irregular':'english100_v11_progressive'}function loadState(){try{return JSON.parse(localStorage.getItem(storageKey()))||empty()}catch{return empty()}}state=loadState();let session=null;const app=document.getElementById('app');function save(){try{localStorage.setItem(storageKey(),JSON.stringify(state))}catch{}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,?!。！？、\s]/g,'').trim()}function accepted(q,txt){return [q.answer,...q.aliases].some(a=>norm(a)===norm(txt))}function qid(si,qi){return si+'-'+qi}function chooseUnit(id){activeUnit=id;sections=id==='be'?beSections:id==='verbs'?verbSections:id==='wh'?whSections:id==='third'?thirdSections:id==='pronouns'?pronounSections:id==='whyhow'?whyhowSections:id==='can1'?can1Sections:id==='can2'?can2Sections:id==='pastbe'?pastBeSections:id==='pastverbs'?pastVerbSections:id==='irregular'?irregularSections:progressiveSections;state=loadState();home()}function home(){session=null;const done=Object.keys(state.done).length;let hist=state.history,avg=hist.length?Math.round(hist.reduce((a,b)=>a+b.percent,0)/hist.length):0;let missed=Object.keys(state.mistakes).filter(id=>state.mistakes[id]===true||Number(state.mistakes[id])<=Date.now()).length;app.innerHTML=`<div class="card"><h2>学習単元を選ぶ</h2><button class="${activeUnit==='be'?'':'secondary'}" onclick="chooseUnit('be')">単元1：be動詞</button><button class="${activeUnit==='verbs'?'':'secondary'}" onclick="chooseUnit('verbs')">単元2：一般動詞</button><button class="${activeUnit==='wh'?'':'secondary'}" onclick="chooseUnit('wh')">単元3：疑問詞</button><button class="${activeUnit==='can1'?'':'secondary'}" onclick="chooseUnit('can1')">単元4：can①</button><button class="${activeUnit==='third'?'':'secondary'}" onclick="chooseUnit('third')">単元5：三人称単数現在形</button><button class="${activeUnit==='can2'?'':'secondary'}" onclick="chooseUnit('can2')">単元6：can②</button><button class="${activeUnit==='pronouns'?'':'secondary'}" onclick="chooseUnit('pronouns')">単元7：人称代名詞</button><button class="${activeUnit==='whyhow'?'':'secondary'}" onclick="chooseUnit('whyhow')">単元8：疑問詞 Why・How</button><button class="${activeUnit==='progressive'?'':'secondary'}" onclick="chooseUnit('progressive')">単元9：現在進行形</button><button class="${activeUnit==='pastbe'?'':'secondary'}" onclick="chooseUnit('pastbe')">単元10：be動詞の過去形</button><button class="${activeUnit==='pastverbs'?'':'secondary'}" onclick="chooseUnit('pastverbs')">単元11：一般動詞の過去形</button><button class="${activeUnit==='irregular'?'':'secondary'}" onclick="chooseUnit('irregular')">単元12：不規則動詞の暗記</button></div><div class="card"><div class="row"><h2>中1｜${activeUnit==='be'?'be動詞の基本':activeUnit==='verbs'?'一般動詞の基本':activeUnit==='wh'?'疑問詞の基本（3単現なし）':activeUnit==='third'?'三人称単数現在形（疑問詞＋doesを含む）':activeUnit==='pronouns'?'人称代名詞（主格・所有格・目的格・所有代名詞）':activeUnit==='whyhow'?'疑問詞 Why・How（理由・方法・数量）':activeUnit==='can1'?'can①（I・you・we・they と What）':activeUnit==='can2'?'can②（三人称単数と When・Where）':activeUnit==='pastbe'?'be動詞の過去形（was / were）':activeUnit==='pastverbs'?'一般動詞の過去形（-ed / 不規則変化 / did）':activeUnit==='irregular'?'不規則動詞の暗記（原形・過去形・意味）':'現在進行形（be動詞＋-ing）'}</h2><span class="pill">約30分</span></div><p class="muted">全国共通・標準〜応用｜40問・全5ステップ</p><div class="notice"><b>先生用テス function calendar(){let now=new Date(),year=now.getFullYear(),month=now.getMonth();let days=new Date(year,month+1,0).getDate();let count={};for(const h of state.history){if(h.date)count[h.date]=(count[h.date]||0)+1}let html='<div class="card"><h2>学習カレンダー</h2><p class="muted">'+(month+1)+'月｜この端末で記録された学習日</p><div class="calendar">';for(let i=1;i<=days;i++){let d=year+'/'+(month+1)+'/'+i;let n=count[d]||0;html+='<span class="day '+(n?'studied':'')+'" title="'+n+'回">'+i+(n?' ✓':'')+'</span>'}return html+'</div></div>'}function toggleTest(){testMode=!testMode;home()}function start(si){session={items:sections[si].qs.map((_,qi)=>({si,qi})),idx:0,results:[],mode:testMode?'test':'normal',si};question()}function review(){let items=Object.keys(state.mistakes).filter(id=>{let v=state.mistakes[id];return v===true||!Number.isFinite(Number(v))||Number(v)<=Date.now()}).map(id=>{let [si,qi]=id.split('-').map(Number);return {si,qi}}).filter(x=>sections[x.si]?.qs[x.qi]);if(!items.length)return home();session={items,idx:0,results:[],mode:testMode?'test':'review',si:null};question()}function question(){let {si,qi}=session.items[session.idx],s=sections[si],q=s.qs[qi];let isSelf=q.kind==='self',isChoice=q.kind==='choice';app.innerHTML=`<div class="card"><div class="row"><span class="pill">${session.mode==='test'?'先生用テストモード':session.mode==='review'?'間違い復習':esc(s.name)}</span><span>${session.idx+1}/${session.items.length}問</span></div><div class="progress" style="margin:15px 0"><div class="bar" style="width:${session.idx/session.items.length*100}%"></div></div><p class="muted">${esc(s.info)}</p><div class="prompt">${esc(q.prompt)}</div>${isChoice&&/\(\s+\)/.test(q.prompt)?'<p class="muted small">次の選択肢から、（　）に入る最も適切な語句を1つ選びなさい。</p>':''}<div id="response">${isSelf?`<p>ノートや頭の中で和訳してから「模範解答を見る」を押してください。</p><textarea id="translation" rows="3" style="font:inherit;width:100%;padding:12px;border:2px solid #b8c8dd;border-radius:10px" placeholder="自分の和訳をメモ（任意）"></textarea><button onclick="reveal()">模範解答を見る</button>`:isChoice?q.choices.map((v,j)=>`<button class="choice" onclick="submitChoice(${j})">${j+1}. ${esc(v)}</button>`).join(''):`<label for="entry">解答を入力</label><input id="entry" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="英語で入力"><button onclick="submitText()">答え合わせ</button>`}</div><div id="feedback"></div>${session.mode==='test'?'<button class="secondary" id="skip" onclick="testSkip()">この問題をスキップ →</button><button class="secondary" onclick="testShow()">模範解答を見る</button>':''}<button id="next" class="hidden" onclick="next()">${session.idx+1===session.items.length?'結果を見る':'次の問題へ →'}</button><button class="secondary" onclick="home()">一覧に戻る</button></div>`;if(!isSelf&&!isChoice)document.getElementById('entry').addEventListener('keydown',e=>{if(e.key==='Enter')submitText()})}

function unitMistakes(id,onlyDue){
 let record={};try{record=JSON.parse(localStorage.getItem(unitStorageKey(id)))||{}}catch(e){}

function scoreForUnit(entry){
 // Pre-v1.5 records had 40 questions only from the current unit.
 const correct=Number.isFinite(Number(entry.coreCorrect))?Number(entry.coreCorrect):Number(entry.correct)||0;

function courseProgress(){
 let passes=0,last=null;
 const statuses=Object.fromEntries(DAILY_UNIT_LIST.map(x=>[x.id,{status:'todo',percent:null}]));
 for(const entry of daily.completed){
  const expected=DAILY_UNIT_LIST[passes%DAILY_UNIT_LIST.length];
  // An old app version could advance despite a low score. Do not treat those
  // subsequent units as passing the still-unfinished earlier unit.
  if(entry.unit!==expected.id)continue;
  const s=scoreForUnit(entry);
  statuses[expected.id]={status:s.master?'master':s.pass?'pass':'need',percent:s.percent,date:entry.date};

const V16_EXTENDED={};
function extendedUnit(id){
 if(V16_EXTENDED[id])return V16_EXTENDED[id];
 const base=unitFor(id).data;
 const copy=base.map(sec=>({...sec,qs:sec.qs.slice()}));
 const practice=[];
 const bank=V16_BANK[id];
 for(const [si,q] of bank.practice){const qi=copy[si].qs.length;copy[si].qs.push(q);practice.push({u:id,si,qi,alt:true,review:true})}
 const checks=bank.checks.map((g,version)=>g.map(q=>{const si=4,qi=copy[si].qs.length;copy[si].qs.push(q);return {u:id,si,qi,check:true,version}}));
 return V16_EXTENDED[id]={sections:copy,practice,checks};
}
function questionForItem(item){
 const u=unitFor(item.u);
 return (item.alt||item.check?extendedUnit(item.u).sections:u.data)[item.si].qs[item.qi];
}
// Create 30 guided practice items and 10 questions not present in the
// regular curriculum. Alternate test banks A/B on successive retries.
createDailyPlan=function(){
 const progress=courseProgress(),u=progress.next;
 if(!progress.needsReview){
  const all=u.data.flatMap((section,si)=>section.qs.map((_,qi)=>({u:u.id,si,qi,review:false,focus:false})));
  const past=allDueMistakes().filter(x=>x.u!==u.id).slice(0,5);
  return {date:ymd(),unit:u.id,items:[...all.slice(0,40-past.length),...past],idx:0,results:[],elapsedMs:0,draft:'',startedAt:Date.now(),retry:false};
 }
 const ext=extendedUnit(u.id), prior=progress.last.entry;
 const failed=new Set((Array.isArray(prior.wrong)?prior.wrong:unitMistakes(u.id,false)).map(x=>`${x.u}:${x.si}:${x.qi}`));
 const practice=[];
 for(let si=0;si<=3;si++){
  const old=u.data[si].qs.map((q,qi)=>({u:u.id,si,qi,review:true,focus:failed.has(`${u.id}:${si}:${qi}`)}));
  old.sort((a,b)=>Number(b.focus)-Number(a.focus));
  const newItems=ext.practice.filter(x=>x.si===si);
  practice.push(...old.slice(0,old.length-newItems.length),...newItems);
 }
 const attempts=daily.completed.filter(x=>x.unit===u.id).length;
 const version=(Math.max(0,attempts-1))%ext.checks.length;
 const checks=ext.checks[version].map(x=>({...x}));
 return {date:ymd(),unit:u.id,items:[...practice,...checks],idx:0,results:[],elapsedMs:0,draft:'',startedAt:Date.now(),retry:true,confirmVersion:version};
};
// Keep normal exercises exactly 40 per unit. Switch to an extended data view
// only while rendering the daily retry questions or teacher check preview.
activateDailyUnit=function(id){
 const u=unitFor(id);activeUnit=u.id;
 sections=(session?.mode==='daily'&&daily.pending?.retry&&session.items.some(x=>x.alt||x.check))||session?.v16Preview?extendedUnit(id).sections:u.data;
 state=loadState();
};
// The course gate uses the 10 confirmation questions on a v1.6 retry day.
// Earlier v1.5 pending lessons, which have no check items, keep the old gate.
const v15CompleteDaily=completeDaily;
completeDaily=function(){
 if(!session||session.mode!=='daily'||!daily.pending)return;
 const retry=daily.pending.retry;
 if(!retry||!session.items.some(x=>x.check)){v15CompleteDaily();return}
 pauseDailyTimer();
 const p=daily.pending, total=session.items.length;
 const correct=session.results.filter(x=>x.correct===true).length;
 const checkIndexes=session.items.map((x,i)=>x.check?i:-1).filter(i=>i>=0);
 const coreTotal=checkIndexes.length,coreCorrect=checkIndexes.filter(i=>session.results[i]?.correct===true).length;
 const pass=coreCorrect*100>=80*coreTotal,master=coreCorrect*100>=90*coreTotal;
 const wrong=session.items.filter((x,i)=>x.u===p.unit&&session.results[i]?.correct===false).map(x=>({u:x.u,si:x.si,qi:x.qi}));
 const entry={date:ymd(),unit:p.unit,correct,total,percent:Math.round(correct*100/total),coreCorrect,coreTotal,corePercent:Math.round(coreCorrect*100/coreTotal),checkCorrect:coreCorrect,checkTotal:coreTotal,practiceCorrect:correct-coreCorrect,practiceTotal:total-coreTotal,retry:true,wrong,elapsedMs:p.elapsedMs};
 if(!daily.completed.some(x=>x.date===entry.date))daily.completed.push(entry);
 activateDailyUnit(p.unit);
 state.history.push({date:new Date().toLocaleDateString('ja-JP'),name:'復習＋新しい合格確認テスト',correct,total,percent:entry.percent,si:null,unit:p.unit});save();
 daily.pending=null;persistDaily();
 const detail=session.items.map((x,i)=>{
  const q=questionForItem(x),r=session.results[i];
  return `<details class="feedback"><summary>${r?.correct?'○':'×'} ${i+1}. ${x.check?'【確認】':''}${esc(q.prompt)}</summary><p>あなたの答え：${esc(r?.userAnswer||'')}</p><p>模範解答：${esc(q.answer)}</p><p>${esc(q.explain||'')}</p></details>`;
 }).join('');
 app.innerHTML=`<div class="card"><h2>復習＋合格確認テスト 完了！</h2><div class="score-result"><h3>${master?'マスター！':pass?'合格！':'要復習'}</h3><div style="font-size:38px;font-weight:800">${entry.corePercent}%</div><div>新しい確認テスト：<b>${coreCorrect}/${coreTotal}問正解</b>（8問以上で合格・9問以上でマスター）</div><div>復習30問：${entry.practiceCorrect}/30問正解</div><div>学習時間：${timeText(p.elapsedMs)}</div></div><div class="notice">${pass?`次の学習日には「${esc(courseProgress().next.label)}」へ進みます。`:`次の学習日も「${esc(unitFor(p.unit).label)}」を練習し、別の確認テストに挑戦します。`}<br>今日の学習履歴を保存しました。</div><button onclick="home()">ホームに戻る</button><h3>解答一覧</h3>${detail}</div>`;
};

let v17ViewedMonth=new Date();
v17ViewedMonth.setDate(1);
function v17ValidDate(value){return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)}
function v17Completed(){return daily.completed.filter(x=>v17ValidDate(x.date)&&DAILY_UNIT_LIST.some(u=>u.id===x.unit))}
function v17LongStreak(){
 const dates=new Set(v17Completed().map(x=>x.date));
 const all=[...dates].sort();let prev=null,run=0,longest=0;
 for(const day of all){
  const d=new Date(day+'T12:00:00');
  if(Number.isNaN(+d))continue;
  if(prev!==null){const expected=new Date(prev);expected.setDate(expected.getDate()+1);run=ymd(expected)===day?run+1:1}
  else run=1;
  prev=d;longest=Math.max(longest,run);
 }
 return longest;
}
function v17Achievements(){
 const entries=v17Completed();const dates=new Set(entries.map(x=>x.date));
 const longest=v17LongStreak();const progress=courseProgress();
 return [
  {symbol:'✓',title:'学習スタート',desc:'初めて30分学習を完了',earned:dates.size>=1},
  {symbol:'3',title:'3日継続',desc:'3日連続で学習を完了',earned:longest>=3},
  {symbol:'7',title:'7日継続',desc:'7日連続で学習を完了',earned:longest>=7},
  {symbol:'A',title:'初めての合格',desc:'単元テストで80%以上',earned:entries.some(e=>scoreForUnit(e).pass)},
  {symbol:'★',title:'マスター達成',desc:'単元テストで90%以上',earned:entries.some(e=>scoreForUnit(e).master)},
  {symbol:'↻',title:'復習から合格',desc:'復習後の確認テストで合格',earned:entries.some(e=>e.retry===true&&scoreForUnit(e).pass)},
  {symbol:'12',title:'全12単元合格',desc:'12単元の合格条件を達成',earned:progress.passes>=12}
 ];
}
function v17CalendarMarkup(){
 const year=v17ViewedMonth.getFullYear(),month=v17ViewedMonth.getMonth();
 const firstDay=new Date(year,month,1).getDay();
 const numDays=new Date(year,month+1,0).getDate();
 const latestByDay=new Map();
 for(const e of v17Completed()){
  if(e.date.startsWith(year+'-'+String(month+1).padStart(2,'0')+'-'))latestByDay.set(e.date,e);
 }
 const weekday=['日','月','火','水','木','金','土'];
 let markup=weekday.map(x=>`<div class="v17-weekday">${x}</div>`).join('');
 for(let i=0;i<firstDay;i++)markup+='<div class="v17-day blank" aria-hidden="true"></div>';
 for(let date=1;date<=numDays;date++){
  const day=ymd(new Date(year,month,date));const entry=latestByDay.get(day);
  const status=entry?scoreForUnit(entry):null;
  const type=!status?'':status.master?'master':status.pass?'pass':'need';
  const mark=!status?'':status.master?'★':status.pass?'✓':'↻';
  const label=!status?'学習記録なし':status.master?'マスター':status.pass?'合格':'要復習';
  markup+=`<div class="v17-day ${type} ${day===ymd()?'today':''}" aria-label="${year}年${month+1}月${date}日：${label}"><span>${date}</span><span class="v17-mark">${mark}</span></div>`;
 }
 const current=new Date();current.setDate(1);current.setHours(0,0,0,0);
 return `<div class="v17-month-nav"><button type="button" onclick="v17MoveMonth(-1)" aria-label="前の月">‹ 前月</button><strong>${year}年 ${month+1}月</strong><button type="button" onclick="v17MoveMonth(1)" aria-label="次の月" ${v17ViewedMonth>=current?'disabled':''}>次月 ›</button></div>
 <div class="v17-calendar" role="group" aria-label="${year}年${month+1}月の学習カレンダー">${markup}</div>

const IRREG_MEMO_KEY='english100_v20_irregular_cards';
let irregMemo={known:{}};
try{const saved=JSON.parse(localStorage.getItem(IRREG_MEMO_KEY));if(saved&&typeof saved==='object'&&saved.known&&typeof saved.known==='object')irregMemo=saved;}catch(e){}
const irregView={mode:'all',index:0,flipped:false};
function saveIrregMemo(){try{localStorage.setItem(IRREG_MEMO_KEY,JSON.stringify(irregMemo))}catch(e){}}
function irregKnownCount(){return irregularWords.filter((_,i)=>irregMemo.known[i]===true).length;}
function irregCardIndices(){return irregularWords.map((_,i)=>i).filter(i=>irregView.mode==='all'||irregMemo.known[i]!==true);}
function showIrregCard(){
  const order=irregCardIndices(),total=irregularWords.length,known=irregKnownCount();
  const head=`<div class="card"><h2>不規則動詞・暗記カード</h2><p class="muted">原形・過去形・日本語の意味を30語覚えましょう。過去分詞は出題しません。</p><div class="memo-count">覚えた語：${known}/${total}語</div><div class="memo-bar"><div style="width:${known/total*100}%"></div></div>`;
  if(order.length===0){app.innerHTML=head+`<div class="memo-intro">30語すべてに「覚えた」を付けました。必要なら全30語を復習できます。</div><button onclick="startIrregCards('all')">全30語をもう一度</button><button class="secondary" onclick="home()">学習画面へ戻る</button></div>`;return;}
  irregView.index=((irregView.index%order.length)+order.length)%order.length;
  const i=order[irregView.index],w=irregularWords[i],flipped=irregView.flipped;
  const readHelp=w.base==='read'?'<p class="muted small">過去形 read の発音は「レッド」です。</p>':'';
  app.innerHTML=head+`<div class="memo-intro">${irregView.mode==='unknown'?'まだ覚えていない語だけを練習しています。':'全30語を順番に練習しています。'}<br>カード ${irregView.index+1}/${order.length}</div>
  <div class="memo-card" aria-live="polite"><span class="memo-meaning">${esc(w.ja)}</span><div class="memo-word">${esc(w.base)}</div><div>↓ 過去形は？</div>
  ${flipped?`<div class="memo-answer">${esc(w.past)}</div>${readHelp}`:'<div class="muted">答えは隠れています</div>'}</div>
  ${flipped?`<div class="memo-actions"><button onclick="markIrregCard(true)">✓ 覚えた</button><button class="secondary" onclick="markIrregCard(false)">× もう一度</button></div>`:'<button onclick="flipIrregCard()">答えを見る</button>'}
  <div class="memo-actions"><button class="secondary" onclick="moveIrregCard(-1)">← 前のカード</button><button class="secondary" onclick="moveIrregCard(1)">次のカード →</button></div>
  <button class="secondary" onclick="startIrregCards('all')">全30語</button><button class="secondary" onclick="startIrregCards('unknown')">未暗記だけ</button>
  <button class="secondary" onclick="home()">学習画面に戻る</button></div>`;
}
function startIrregCards(mode){session=null;irregView.mode=mode==='unknown'?'unknown':'all';irregView.index=0;irregView.flipped=false;showIrregCard();}
function flipIrregCard(){irregView.flipped=true;showIrregCard()}
function moveIrregCard(amount){irregView.index+=amount;irregView.flipped=false;showIrregCard()}
function markIrregCard(remembered){
 const order=irregCardIndices();if(!order.length)return;
 const i=order[((irregView.index%order.length)+order.length)%order.length];
 irregMemo.known[i]=!!remembered;saveIrregMemo();
 if(irregView.mode==='all'||!remembered)irregView.index++;
 irregView.flipped=false;showIrregCard();
}

// Separate key: never rewrites existing learner data or the v2.0 irregular cards.
const POINTS_KEY = 'english100_v21_points';
let pointsState = {earnings:[],tests:[]};
try {
  const stored=JSON.parse(localStorage.getItem(POINTS_KEY));
  if(stored && typeof stored==='object'){
    pointsState.earnings=Array.isArray(stored.earnings)?stored.earnings:[];
    pointsState.tests=Array.isArray(stored.tests)?stored.tests:[];
  }
}catch(e){}
function savePoints(){try{localStorage.setItem(POINTS_KEY,JSON.stringify(pointsState))}catch(e){}}
function totalPoints(){return Math.max(0,pointsState.earnings.reduce((sum,x)=>sum+(Number(x.points)||0),0))}
function awardOnce(key,amount,kind,unit,meta){
  if(pointsState.earnings.some(x=>x.key===key))return false;
  pointsState.earnings.push({key,points:amount,date:ymd(),kind,unit,...meta});
  savePoints();return true;
}
function rewardForScore(score){return score>=90?30:score>=80?20:score>=60?10:0}
const v20CompleteDaily=completeDaily;
completeDaily=function(){
  const previous=daily.completed.length;
  const wasTeacher=!!testMode;
  const date=ymd();
  v20CompleteDaily();
  if(!wasTeacher && daily.completed.length>previous){
    const entry=daily.completed.find(x=>x.date===date);
    if(entry && awardOnce('daily:'+date,10,'daily',entry.unit,{score:entry.corePercent??entry.percent})){
      const message=document.querySelector('.score-result');
      if(message)message.insertAdjacentHTML('beforeend','<p class="point-award">今日の30分学習完了：＋10P 🎉</p>');
    }
  }
};

// Every unit has two independent 10-item confirmation banks from v1.6.
// We use those as auto-graded short tests. Self-scored translations are excluded.
let shortQuiz=null;
function quizQuestions(unit,variant){
 const tests=V16_BANK[unit]?.checks;
 if(!Array.isArray(tests)||tests.length<2)return [];
 return tests[variant%tests.length].filter(q=>q.kind==='choice'||q.kind==='input');
}

 ${count?'<h3>最近の小テスト</h3>'+records:''}</section>`;

function startShortQuiz(id){
 const unit=DAILY_UNIT_LIST.find(x=>x.id===id);
 if(!unit){alert('単元が見つかりません。');return}
 if(session?.mode==='daily'){pauseDailyTimer();saveDailyProgress()}
 session=null;
 const attempts=pointsState.tests.filter(x=>x.unit===id && !x.teacher).length;
 const variant=attempts%2;
 const qs=quizQuestions(id,variant);
 if(qs.length!==10){alert('この単元の小テストは準備中です。');home();return}
 shortQuiz={unit:id,variant,questions:qs,idx:0,results:[],teacher:!!testMode,showTeacherAnswer:false};
 renderShortQuiz();
}
function currentQuizQuestion(){return shortQuiz?.questions[shortQuiz.idx]}
function renderShortQuiz(){
 if(!shortQuiz)return;
 const q=currentQuizQuestion(),r=shortQuiz.results[shortQuiz.idx];
 const questionMarkup=q.kind==='choice'
   ?q.choices.map((option,i)=>`<button class="choice" onclick="answerQuizChoice(${i})">${i+1}. ${esc(option)}</button>`).join('')
   :`<label for="miniInput">英語で解答を入力</label><input id="miniInput" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="答えを入力"><button onclick="answerQuizText()">答え合わせ</button>`;
 const response=r?`<div class="feedback"><b>${r.correct===null?'－ スキップ':r.correct?'○ 正解！':'× 不正解'}</b><p>あなたの解答：${esc(r.answer)}</p><p>模範解答：<strong>${esc(q.answer)}</strong></p><p>${esc(q.explain||'正しい形を確認しましょう。')}</p></div><button onclick="nextShortQuiz()">${shortQuiz.idx+1===10?'結果を見る':'次の問題へ →'}</button>`:
    `<div id="miniResponse">${questionMarkup}</div>${shortQuiz.teacher?`<div class="mini-teacher"><button class="secondary" onclick="showQuizAnswer()">模範解答を見る</button><button class="secondary" onclick="skipShortQuiz()">スキップ →</button>${shortQuiz.showTeacherAnswer?`<div class="feedback">模範解答：${esc(q.answer)}<p>${esc(q.explain||'')}</p></div>`:''}</div>`:''}`;
 app.innerHTML=`<section class="card"><div class="mini-topline"><h2>小テスト：${esc(unitFor(shortQuiz.unit).label)}</h2><span class="pill">${shortQuiz.teacher?'先生用・記録なし':'10問'}</span></div><p class="muted small">問題 ${shortQuiz.idx+1} / 10（${shortQuiz.variant===0?'A':'B'}版）</p>
 <div class="progress"><div class="bar" style="width:${shortQuiz.idx*10}%"></div></div>
 <p class="prompt">${esc(q.prompt)}</p>${response}<button class="secondary" onclick="home()">小テストを中断して戻る</button>
 <p class="muted small">中断すると、今回の解答は保存されません。小テストは最後まで終えると採点します。</p></section>`;
 if(!r && q.kind==='input'){
   const field=document.getElementById('miniInput');
   if(field)field.addEventListener('keydown',e=>{if(e.key==='Enter')answerQuizText()});
 }
}
function submitQuizResponse(correct,answer){
 if(!shortQuiz||shortQuiz.results.length!==shortQuiz.idx)return;
 shortQuiz.results.push({correct,answer});
 renderShortQuiz();
}
function answerQuizChoice(index){
 const q=currentQuizQuestion();if(!q||q.kind!=='choice'||!q.choices[index])return;
 submitQuizResponse(q.choices[index]===q.answer,q.choices[index]);
}
function answerQuizText(){
 const q=currentQuizQuestion(),field=document.getElementById('miniInput');
 if(!q||q.kind!=='input'||!field)return;
 const answer=field.value.trim();if(!answer){alert('解答を入力してください。');return}
 submitQuizResponse(accepted(q,answer),answer);
}
function showQuizAnswer(){if(shortQuiz?.teacher){shortQuiz.showTeacherAnswer=true;renderShortQuiz()}}
function skipShortQuiz(){if(shortQuiz?.teacher){submitQuizResponse(null,'スキップ');nextShortQuiz()}}
function nextShortQuiz(){
 if(!shortQuiz||shortQuiz.results.length<=shortQuiz.idx)return;
 if(shortQuiz.idx<9){shortQuiz.idx++;shortQuiz.showTeacherAnswer=false;renderShortQuiz()}else finishShortQuiz();
}
function finishShortQuiz(){
 if(!shortQuiz||shortQuiz.results.length!==10)return;
 const qz=shortQuiz;
 const correct=qz.results.filter(r=>r.correct===true).length;
 const score=correct*10;
 let awarded=0;
 if(!qz.teacher){
   const date=ymd();
   const key=`quiz:${date}:${qz.unit}`;
   const points=rewardForScore(score);
   const eligible=!pointsState.tests.some(t=>t.date===date&&t.unit===qz.unit&&!t.teacher);
   if(eligible){
     if(points>0 && awardOnce(key,points,'quiz',qz.unit,{score}))awarded=points;
   }
   pointsState.tests.push({date,unit:qz.unit,score,correct,total:10,awarded,variant:qz.variant,teacher:false});
   savePoints();
 }
 const details=qz.questions.map((q,i)=>`<details class="feedback"><summary>${qz.results[i].correct===null?'－':qz.results[i].correct?'○':'×'} ${i+1}. ${esc(q.prompt)}</summary><p>あなたの解答：${esc(qz.results[i].answer)}</p><p>模範解答：${esc(q.answer)}</p><p>${esc(q.explain||'')}</p></details>`).join('');
 const rewardText=qz.teacher?'先生用の確認です。得点・学習ポイントは保存されません。':awarded>0?`今回の獲得ポイント：＋${awarded}P`:'今回の獲得ポイント：0P（60点未満、または同じ単元で本日2回目以降）';
 app.innerHTML=`<section class="card"><h2>小テスト結果：${esc(unitFor(qz.unit).label)}</h2><div class="score-result"><div class="mini-score">${score}点</div><p>10問中 ${correct}問正解</p><p class="point-award">${esc(rewardText)}</p>${!qz.teacher?`<p>現在の保有ポイント：<strong>${totalPoints()}P</strong></p>`:''}</div><p class="muted small">小テストの点数は、毎日の30分学習の合格判定とは別に記録します。</p>
 <button onclick="home()">ホームに戻る</button><h3>解答を確認する</h3>${details}</section>`;
}

const GACHA_RATES = [{rarity:'N',chance:0.60},{rarity:'R',chance:0.30},{rarity:'SR',chance:0.10}];
let gachaLocked=false;
let gachaAlbumFilter='all';
function gachaTransactions(){return pointsState.earnings.filter(x=>x.kind==='gacha'&&typeof x.cardId==='string'&&GACHA_CARDS.some(c=>c.id===x.cardId))}
function gachaOwned(){return new Set(gachaTransactions().map(x=>x.cardId))}
function gachaCardById(id){return GACHA_CARDS.find(x=>x.id===id)}
function gachaRng(){
  try {if(window.crypto&&window.crypto.getRandomValues){const a=new Uint32Array(1);window.crypto.getRandomValues(a);return a[0]/4294967296}}catch(e){}
  return Math.random();
}
function gachaChooseCard(){
  const p=gachaRng();
  const rarity=p<0.60?'N':p<0.90?'R':'SR';
  const pool=GACHA_CARDS.filter(x=>x.rarity===rarity);
  return pool[Math.floor(gachaRng()*pool.length)];
}
function gachaCardMarkup(c,big=false,locked=false){
  if(!c)return '';
  return `<div class="gacha-card-face ${c.rarity.toLowerCase()}${big?' big':''}${locked?' locked':''}">

function focusQuestion(){if(!focusRun)return null;const p=focusRun.items[focusRun.idx];return unitFor(focusRun.unit).data[p.si]?.qs[p.qi]||null;}
function focusRender(){
 if(!focusRun)return home();
 if(focusRun.idx>=focusRun.items.length)return focusFinish();

 if(!q){alert('問題が見つからないため復習を終了します。');focusRun=null;focusState.pending=null;focusSave();return home();}
 const answered=focusRun.results[focusRun.idx];
 const area=q.kind==='choice'?`<div role="group" aria-label="選択肢">${q.choices.map((choice,i)=>`<button class="choice" onclick="focusAnswerChoice(${i})" ${answered?'disabled':''}>${esc(choice)}</button>`).join('')}</div>`:
 q.kind==='input'?`<label class="mini-label" for="focus-entry">英語で入力</label><input id="focus-entry" type="text" autocomplete="off" spellcheck="false" placeholder="解答を入力" ${answered?'disabled':''}><button onclick="focusAnswerInput()" ${answered?'disabled':''}>解答を確認</button>`:
 `<button onclick="focusReveal()" ${answered?'disabled':''}>模範解答を見て自己採点</button>`;
 const feedback=answered?focusFeedback(q,answered):'';
 app.innerHTML=`<section class="card focus-task"><span class="focus-back" onclick="focusExit()" role="button" tabindex="0">← 学習ホームへ戻る</span><div class="focus-top"><span class="focus-badge">🎯 苦手克服・10問</span><b>${focusRun.idx+1}/${focusRun.items.length}問</b></div><div class="progress"><div class="bar" style="width:${focusRun.idx/focusRun.items.length*100}%"></div></div><p class="muted small">${esc(unitFor(focusRun.unit).label)}／${esc(FOCUS_LABELS[it.si])}${focusRun.teacher?' ／ 先生用（記録なし）':''}</p><div class="focus-prompt">${esc(q.prompt)}</div>${area}<div id="focus-response">${feedback}</div>${answered?`<button onclick="focusNext()">${focusRun.idx===focusRun.items.length-1?'結果を見る':'次の問題へ →'}</button>`:''}</section>`;

}
function focusFeedback(q,r){

function focusRecord(q,correct,answer){

function focusReveal(){const q=focusQuestion();if(!q||q.kind!=='self')return;const area=document.getElementById('focus-response');area.innerHTML=`<div class="feedback"><b>模範解答：${esc(q.answer)}</b><p>${esc(q.explain||'意味が合っているか確認しましょう。')}</p><button onclick="focusRecord(focusQuestion(),true,'自己採点：正解')">正解だった</button><button class="secondary" onclick="focusRecord(focusQuestion(),false,'自己採点：不正解')">間違えた</button></div>`;}
function focusSaveUnitMistake(wrong){
 const p=focusRun.items[focusRun.idx],id=focusRun.unit,k=unitStorageKey(id);
 try{
   const r=JSON.parse(localStorage.getItem(k))||{done:{},history:[],mistakes:{}};

   localStorage.setItem(k,JSON.stringify(r));

 }catch(e){}
}
function focusAcceptAlternative(){
 if(!focusRun)return;const r=focusRun.results[focusRun.idx],q=focusQuestion();if(!r||r.correct||q?.kind!=='input')return;

const V27_PUBLIC_VIDEOS = Object.freeze({
 // be:'abcdefghijk', verbs:'abcdefghijk', ...
});
const V27_LOCAL_KEY='english100_v27_video_preview_urls';
let v27LocalVideos={};
try{
 const raw=JSON.parse(localStorage.getItem(V27_LOCAL_KEY)||'{}');
 if(raw && typeof raw==='object' && !Array.isArray(raw)){
  for(const [key,val] of Object.entries(raw)){
   if(DAILY_UNIT_LIST.some(u=>u.id===key)&&/^[A-Za-z0-9_-]{11}$/.test(String(val))){v27LocalVideos[key]=val}
  }
 }
}catch(e){}
let v27Selected='be';
function v27VideoId(unit){
 const local=v27LocalVideos[unit];
 const published=V27_PUBLIC_VIDEOS[unit];
 return /^[A-Za-z0-9_-]{11}$/.test(local||'')?local:/^[A-Za-z0-9_-]{11}$/.test(published||'')?published:'';
}
function v27ExtractId(raw){
 const s=String(raw||'').trim();if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;
 try{
  const url=new URL(s);
  if(url.protocol!=='https:')return '';
  const host=url.hostname.toLowerCase();
  let id='';
  if(host==='youtu.be')id=url.pathname.split('/')[1]||'';
  else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','www.youtube-nocookie.com','youtube-nocookie.com'].includes(host)){
   if(url.pathname==='/watch')id=url.searchParams.get('v')||'';
   else if(/^\/(embed|shorts|live)\//.test(url.pathname))id=url.pathname.split('/')[2]||'';
  }
  return /^[A-Za-z0-9_-]{11}$/.test(id)?id:'';
 }catch(e){return ''}
}

const V28_KEY='english100_v28_expression_training';
let v28={track:'sunshine',unit:'be',progress:{},pending:null};
try{
 const loaded=JSON.parse(localStorage.getItem(V28_KEY)||'null');
 if(loaded && typeof loaded==='object'){
   if(V28_TRACKS.some(t=>t.id===loaded.track))v28.track=loaded.track;
   if(V28_PACKS.some(p=>p.id===loaded.unit))v28.unit=loaded.unit;
   if(loaded.progress && typeof loaded.progress==='object'&&!Array.isArray(loaded.progress))v28.progress=loaded.progress;
   if(loaded.pending && typeof loaded.pending==='object'&&Array.isArray(loaded.pending.results) && V28_PACKS.some(p=>p.id===loaded.pending.unit) && V28_TRACKS.some(t=>t.id===loaded.pending.track) && loaded.pending.results.length<=12) v28.pending=loaded.pending;
 }
}catch(e){}
function v28Save(){try{localStorage.setItem(V28_KEY,JSON.stringify(v28))}catch(e){}}
function v28Pack(id){return V28_PACKS.find(p=>p.id===id)||V28_PACKS[0]}
function v28ProgressKey(){return v28.track+':'+v28.unit}
function v28ProgressInfo(){return v28.progress[v28ProgressKey()]||null}
function v28Phase(i){return i<4?0:i<8?1:2}
function v28PhaseName(i){return ['① 和訳','② 穴埋め','③ 確認テスト'][v28Phase(i)]}
function v28Question(i){
 const pack=v28Pack(v28.pending.unit),n=i%4,e=pack.entries[n];
 let prompt='',opts=[],answer='',explain=e.rule;
 if(i<4){prompt=e.en;opts=pack.entries.map(x=>x.jp);answer=e.jp;}
 else if(i<8){prompt=e.gap;opts=[e.answer,...e.wrongs];answer=e.answer;}
 else {prompt=e.moreJp;opts=pack.entries.map(x=>x.more);answer=e.more;}
 // Stable rotation avoids always showing the answer in position 1.
 const shift=(i+2)%4;
 opts=[...opts.slice(shift),...opts.slice(0,shift)];
 return {e,prompt,opts,answer,explain,hint:(i>=4&&i<8&&e.gapJp)?e.gapJp:null};
}

 const title=selected?'続きから再開':'12問の表現練習を始める';
 let html=`<section class="card v28-panel" id="v28-panel"><div class="row"><h2>📝 教科書別・重要表現トレーニング</h2><span class="pill">新機能</span></div>

 <div class="v28-summary"><div class="v28-stat"><strong>${Object.keys(v28.progress).filter(k=>k.startsWith(v28.track+':')).length}</strong>学習済みテーマ</div><div class="v28-stat"><strong>${existing?.best??'—'}</strong>今回の最高点</div><div class="v28-stat"><strong>${done}/12</strong>今回の進捗</div></div>

function v28Refresh(){const e=document.getElementById('v28-panel');if(e)e.outerHTML=v28View()}
function v28SetTrack(track){if(!V28_TRACKS.some(t=>t.id===track))return;v28.track=track;v28Save();v28Refresh()}
function v28SetUnit(id){if(!V28_PACKS.some(t=>t.id===id))return;v28.unit=id;v28Save();v28Refresh()}
function v28Start(){
 v28Locked=false;
 if(!v28.pending||v28.pending.track!==v28.track||v28.pending.unit!==v28.unit){v28.pending={track:v28.track,unit:v28.unit,results:[],date:new Date().toLocaleDateString('ja-JP'),finished:false};v28Save()}
 v28RenderRun();
}
function v28Restart(){if(!confirm('このセットを1問目からやり直しますか？（最高点の記録は残ります）'))return;v28.pending=null;v28Save();v28Start()}
function v28RenderRun(){
 const root=document.getElementById('v28-run'),pending=v28.pending;
 if(!root||!pending||pending.unit!==v28.unit||pending.track!==v28.track)return;
 const i=pending.results.length;
 if(i>=12){v28Complete();return;}
 const q=v28Question(i),phase=v28Phase(i);
 const phases=['① 和訳','② 穴埋め','③ 確認テスト'];
 root.innerHTML=`<div class="v28-quiz"><p class="v28-muted">${esc(phases[phase])} ・${i+1}/12問</p><div class="v28-progress"><div style="width:${i/12*100}%"></div></div><h3>${phase===0?'次の英文の日本語訳を選びなさい。':phase===1?'（　）に入る語句を選びなさい。':'次の日本語に合う英文を選びなさい。'}<br>${esc(q.prompt)}${q.hint?`<span class="v29-hint">日本語の意味：${esc(q.hint)}</span>`:""}</h3>
 <div id="v28-answers">${q.opts.map((a,n)=>`<button class="v28-choice" onclick="v28Answer(${n})">${n+1}. ${esc(a)}</button>`).join('')}</div><div id="v28-result" aria-live="polite"></div><button class="secondary" onclick="v28Exit()">ホームに戻る</button></div>`;
 root.scrollIntoView({behavior:'smooth',block:'start'});
}
let v28Locked=false;
function v28Answer(index){
 const p=v28.pending;if(!p||p.results.length>=12||v28Locked)return;
 const q=v28Question(p.results.length);if(index<0||index>3)return;
 const selected=q.opts[index],correct=selected===q.answer;
 const buttons=document.querySelectorAll('#v28-answers .v28-choice');if(buttons.length!==4)return;
 v28Locked=true;
 buttons.forEach((b,i)=>{b.disabled=true;if(q.opts[i]===q.answer)b.classList.add('good');else if(i===index)b.classList.add('bad')});
 p.results.push({correct,answer:selected});v28Save();
 const r=document.getElementById('v28-result');
 if(r)r.innerHTML=`<div class="v28-result ${correct?'':'bad'}"><strong>${correct?'○ 正解！':'△ 正解を確認しよう'}</strong><br>正解：${esc(q.answer)}<br>${esc(q.explain)}</div><button onclick="v28Next()">${p.results.length>=12?'結果を見る':'次の問題へ →'}</button>`;
}
function v28Next(){v28Locked=false;const p=v28.pending;if(!p)return;if(p.results.length>=12)v28Complete();else v28RenderRun()}
function v28Exit(){v28Locked=false;v28Refresh();document.getElementById('v28-panel')?.scrollIntoView({block:'start'})}
function v28Complete(){
 const p=v28.pending;if(!p||p.results.length<12)return;
 const correct=p.results.filter(r=>r.correct).length,score=Math.round(correct/12*100),key=p.track+':'+p.unit;
 if(!p.finished){
  const old=v28.progress[key]||{};
  v28.progress[key]={best:Math.max(Number(old.best)||0,score),last:score,completed:(Number(old.completed)||0)+1,date:new Date().toLocaleDateString('ja-JP')};
  p.finished=true;v28Save();

const V30_ENTRIES=Object.fromEntries(V30_GROUPS.flatMap(g=>g.entries.map(e=>[e.id,{...e,grade:g.grade,group:g.id}])));

 }

function v30Today(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function v30SelectGroup(){if(!v30Allowed().some(g=>g.id===v30.group))v30.group=v30Allowed()[0].id;return V30_GROUPS.find(g=>g.id===v30.group)}

function v30Stats(){const all=Object.keys(v30.progress).filter(k=>k.startsWith(v30.track+':'));
 let practiced=0,mastered=0,due=0;
 for(const key of all){const item=V30_ENTRIES[key.split(':')[1]],p=v30.progress[key];if(!item)continue; if(p.attempts>0)practiced++;if(p.streak>=2)mastered++;if(item.grade<=v30.grade && p.due && p.due<=v30Today())due++;}

 <label>学習学年<select onchange="v30SetGrade(this.value)">${[1,2,3].map(y=>`<option value="${y}" ${v30.grade===y?'selected':''}>${V30_GRADE_LABEL[y]}</option>`).join('')}</select></label>

function v30NewLesson(type='lesson'){
 const g=v30SelectGroup();

  items=Object.entries(v30.progress).filter(([key,p])=>key.startsWith(v30.track+':')&&p.due&&p.due<=v30Today()&&V30_ENTRIES[key.split(':')[1]]?.grade<=v30.grade)

  items=[...g.entries.map(e=>({id:e.id,phase:0})),...g.entries.map(e=>({id:e.id,phase:1})),...g.entries.map(e=>({id:e.id,phase:2}))];

  if(!value||typeof value!=='object'||Array.isArray(value))throw Error('出題設定の内容が正しくありません。');
  const phrases=value.phrases;
  if(!Array.isArray(phrases)||phrases.length>8||phrases.some(id=>typeof id!=='string'||!V30_ENTRIES[id])||new Set(phrases).size!==phrases.length)throw Error('登録された重要表現を確認してください。');

  let size=0;
  for(const [key,value] of entries){
   if(!V32_KEY_REGEX.test(key)||typeof value!=='string')throw Error('このアプリ以外のデータが含まれています。');
   size+=key.length+value.length;
   if(value.length>2500000||size>6500000)throw Error('保存データが大きすぎます。');
  }
  return {type:'full',createdAt:pack.createdAt,data};
 }
 if(pack.type==='program-settings'){
  return {type:'program-settings',createdAt:pack.createdAt,assignments:v32AssignmentClean(pack.assignments)};
 }
 throw Error('バックアップの種類が不明です。');
}

// minimized, aggregated summaries. No learner name or original backup is retained.
const T33_KEY='teacher_v33_local_reports'; // intentionally excluded from v3.2 learner backup export
let t33={students:[],selected:null};
try{
 const old=JSON.parse(localStorage.getItem(T33_KEY)||'null');
 if(old&&Array.isArray(old.students)&&old.students.length<=200){
  t33.students=old.students.filter(x=>x&&typeof x.id==='string'&&typeof x.alias==='string'&&x.summary&&typeof x.summary==='object').slice(0,100);

function t33Save(){try{localStorage.setItem(T33_KEY,JSON.stringify(t33));return true}catch(e){alert('端末の保存領域が足りません。保存できませんでした。');return false}}
function t33JSON(value){try{return JSON.parse(value||'null')}catch(e){return null}}
function t33Pct(v){const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):0}
function t33SafeDate(v){return typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v)?v:''}
function t33DateJa(v){const d=t33SafeDate(v);return d?d.replace(/-/g,'/'):'--'}
function t33Summarize(backup){
 if(!backup||backup.type!=='full'||!backup.data)throw Error('「全データを保存」したJSONファイルを選んでください。');
 const data=backup.data;
 const dailyLog=t33JSON(data.english100_v14_daily);
 const pointsLog=t33JSON(data.english100_v21_points);
 const dailyItems=Array.isArray(dailyLog?.completed)?dailyLog.completed:[];
 const quizItems=Array.isArray(pointsLog?.tests)?pointsLog.tests.filter(t=>t&&!t.teacher):[];
 const earnings=Array.isArray(pointsLog?.earnings)?pointsLog.earnings:[];
 const dailyEntries=dailyItems.filter(t=>t&&DAILY_UNIT_LIST.some(u=>u.id===t.unit)&&t33SafeDate(t.date)).slice(-2000);
 const quizzes=quizItems.filter(t=>t&&DAILY_UNIT_LIST.some(u=>u.id===t.unit)&&t33SafeDate(t.date)&&Number.isFinite(Number(t.score))).slice(-2000);
 const dates=[...new Set(dailyEntries.map(x=>x.date))].sort();
 let streak=0;
 if(dates.length){
  const current=new Date(dates[dates.length-1]+'T12:00:00');
  while(dates.includes(ymd(current))){streak++;current.setDate(current.getDate()-1);if(streak>10000)break}
 }
 let passes=0;
 const mastery=Object.fromEntries(DAILY_UNIT_LIST.map(u=>[u.id,{status:'未挑戦',score:null}]));
 const latest=Object.create(null);
 for(const item of dailyEntries){
  const s=scoreForUnit(item);
  latest[item.unit]={score:t33Pct(s.percent),date:item.date};
  const unit=DAILY_UNIT_LIST[passes%DAILY_UNIT_LIST.length];
  if(item.unit!==unit.id)continue;
  mastery[unit.id]={status:s.master?'マスター':s.pass?'合格':'要復習',score:t33Pct(s.percent),date:item.date};
  if(s.pass)passes++;
 }
 const quizLatest=Object.create(null);
 for(const t of quizzes)quizLatest[t.unit]={score:t33Pct(t.score),date:t.date};
 const weak=DAILY_UNIT_LIST.map(u=>{
   const unit=latest[u.id],test=quizLatest[u.id];
   const score=unit&&test?Math.min(unit.score,test.score):unit?.score??test?.score;
   return score!==undefined&&score<80?{unit:u.label,score}:null;
 }).filter(Boolean).sort((a,b)=>a.score-b.score).slice(0,5);
 let points=0;
 for(const e of earnings){
  const p=Number(e?.points);
  if(Number.isFinite(p)&&Math.abs(p)<1000000)points+=p;
 }
 const owned=[...new Set(earnings.filter(e=>e?.kind==='gacha'&&GACHA_CARDS.some(c=>c.id===e.cardId)).map(e=>e.cardId))].length;
 const pending=dailyLog?.pending;
 const progress=pending&&DAILY_UNIT_LIST.some(u=>u.id===pending.unit)&&Array.isArray(pending.items)&&Array.isArray(pending.results)?
  {unit:unitFor(pending.unit).label,done:Math.min(pending.results.length,pending.items.length),total:pending.items.length}:null;
 const avg=quizzes.length?Math.round(quizzes.reduce((sum,x)=>sum+t33Pct(x.score),0)/quizzes.length):null;
 return {
  dailyDays:dates.length,streak,latestDay:dates.at(-1)||'',passUnits:Object.values(mastery).filter(m=>m.status==='合格'||m.status==='マスター').length,
  mastery,weak,latest,quizCount:quizzes.length,quizAvg:avg,
  recentQuizzes:quizzes.slice(-6).reverse().map(x=>({date:x.date,unit:unitFor(x.unit).label,score:t33Pct(x.score)})),
  points:Math.max(0,Math.round(points)),cards:owned,progress
 };
}

 const latestQuiz=Array.isArray(s.recentQuizzes)?s.recentQuizzes:[];
 const mastery=DAILY_UNIT_LIST.map(u=>{

  </div>
  <p class="small muted">最終学習日：${esc(t33DateJa(s.latestDay))} ／ ポイント ${Number(s.points)||0}P ／ カード ${Number(s.cards)||0}枚</p>
  ${s.progress?`<p class="t33-notice">学習途中：${esc(s.progress.unit)} ${Number(s.progress.done)||0}/${Number(s.progress.total)||0}問</p>`:''}
  <h4>優先して復習したい単元</h4><p class="t33-weak-wrap">${weak}</p>
  <h4>直近の小テスト</h4>${latestQuiz.length?latestQuiz.map(q=>`<div class="t33-result"><span>${esc(t33DateJa(q.date))}・${esc(q.unit)}</span><b>${t33Pct(q.score)}点</b></div>`).join(''):'<p class="muted small">小テストの記録はありません。</p>'}
  <details class="t33-fold"><summary>12単元の習得状況を見る</summary><div class="t33-unit-grid">${mastery}</div></details>
  <div class="t33-actions"><button class="secondary" onclick="t33Rename('${esc(x.id)}')">表示名を変更</button><button class="secondary" onclick="t33Remove('${esc(x.id)}')">一覧から削除</button></div>
 </div>`;
}

async function t33Import(){
 const input=document.getElementById('t33-files'),files=[...(input?.files||[])];
 const aliasInput=(document.getElementById('t33-alias')?.value||'').trim().slice(0,24);
 const status=document.getElementById('t33-import-status');
 if(!files.length){if(status)status.textContent='JSONファイルを選択してください。';return}
 if(files.length>20){if(status)status.textContent='1回につき20件まで選択してください。';return}
 if(files.length>1&&aliasInput){if(status)status.textContent='複数ファイルの取り込みでは表示名を空欄にしてください。';return}
 const reports=[];const errors=[];
 for(const file of files){
  try{
   if(file.size>8000000)throw Error('ファイルは8MB以下にしてください');
   const validated=v32Validate(JSON.parse(await file.text()));
   const summary=t33Summarize(validated);
   reports.push({summary,createdAt:validated.createdAt});
  }catch(e){errors.push(`${file.name.slice(0,40)}：${e.message}`)}
 }
 if(!reports.length){if(status)status.textContent='読み込み失敗：'+errors.join(' ／ ');return}
 if(t33.students.length+reports.length>100){if(status)status.textContent='試作版では最大100名まで登録できます。';return}
 if(files.length===1 && aliasInput && t33.students.some(x=>x.alias===aliasInput)){
  if(!confirm(`「${aliasInput}」の既存集計を新しいバックアップで更新しますか？`))return;
 }
 for(let i=0;i<reports.length;i++){
  const alias=aliasInput||t33NextAlias();
  const existing=t33.students.find(x=>x.alias===alias);
  const record={id:existing?.id||`student_${Date.now()}_${i}_${Math.random().toString(36).slice(2,9)}`,
    alias,importedAt:new Date().toISOString(),sourceDate:reports[i].createdAt,summary:reports[i].summary};
  if(existing)t33.students.splice(t33.students.indexOf(existing),1,record);
  else t33.students.push(record);
  t33.selected=record.id;
 }
 t33Save();t33Refresh();
 const msg=document.getElementById('t33-import-status');
 if(msg)msg.textContent=`${reports.length}件を取り込みました。${errors.length?'エラー：'+errors.join(' ／ '):''}`;
}
function t33NextAlias(){let k=1;while(t33.students.some(x=>x.alias===`生徒${k}`))k++;return `生徒${k}`;}
function t33Rename(id){const x=t33.students.find(x=>x.id===id);if(!x)return;const next=prompt('生徒の表示名（仮名のみ）',x.alias);if(next===null)return;const name=next.trim().slice(0,24);if(!name){alert('表示名を入力してください');return}if(t33.students.some(y=>y.id!==id&&y.alias===name)){alert('その表示名は使用中です');return}x.alias=name;t33Save();t33Refresh();}
function t33Remove(id){const x=t33.students.find(x=>x.id===id);if(!x||!confirm(`「${x.alias}」の集計をこの端末から削除しますか？（生徒本人の記録は変更されません）`))return;t33.students=t33.students.filter(x=>x.id!==id);t33.selected=t33.students[0]?.id||null;t33Save();t33Refresh();}
function t33CSV(){
 const lines=[['表示名','取込日時','最終学習日','累計学習日数','連続学習日数','合格単元数','小テスト回数','小テスト平均','要復習単元','学習ポイント','カード数']];
 for(const x of t33.students){const s=x.summary;lines.push([x.alias,x.importedAt,s.latestDay,s.dailyDays,s.streak,s.passUnits,s.quizCount,s.quizAvg??'',(s.weak||[]).map(w=>`${w.unit} ${w.score}%`).join(' / '),s.points,s.cards]);}
 const csv='\ufeff'+lines.map(row=>row.map(v=>{let text=String(v??'');if(/^\s*[=+\-@]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='english100_teacher_summary_'+ymd()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000);
}
